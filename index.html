<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEW HORIZON English Course3</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
  html, body {
    margin: 0; padding: 0; height: 100vh; width: 100vw;
    background: #fff;
    overflow: hidden;
    font-family: "メイリオ", meiryo, sans-serif;
  }
  #parentContainer {
    position: absolute;
    width: 1920px;
    height: 1080px;
    background: #fff;
    left: 50%;
    top: 50%;
    border: none;
    transform-origin: 50% 50%;
  }

  .sidebar {
    position: absolute;
    top: 0;
    width: 97.4px;
    height: 1080px;
    background: #cacaca;
    box-sizing: border-box;
    padding-top: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #sidebarLeft { left: 0; }
  #sidebarRight { right: 0; }

  .sidebarItem {
    width: 71px;
    height: 71px;
    margin-bottom: 13px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.15));
    position: relative;
  }
  .sidebarItem img {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* 目次のボタンだけグレーアウト */
  .sidebarItem.disabled img {
    filter: grayscale(100%) brightness(70%);
    cursor: default;
  }

  #toggleLeftSwitch, #toggleRightSwitch {
    position: absolute;
    width: 30.8px;
    height: 86.4px;
    top: 496.8px;
    cursor: pointer;
    z-index: 1100;
  }
  #toggleLeftSwitch { left: 0; }
  #toggleRightSwitch { left: 1886.2px; }

  #toggleLeftSwitch img, #toggleRightSwitch img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  /* 紙面表示エリア */
  #pageContainer {
    position: absolute;
    width: 1534.9px;
    height: 1040.1px;
    left: 191.3px;
    top: 0;
    overflow: hidden;
    background: #fff;
    user-select: none;
  }
  #pageImage {
    position: absolute;
    left: 0; top: 0;
    width: 1534.9px;
    height: 1040.1px;
    cursor: grab;
    touch-action: none;
    transition: transform 0.1s ease-out;
  }

  /* ページ切替ボタン */
  #pageLeftBtn, #pageRightBtn {
    position: absolute;
    width: 70.3px;
    height: 39.9px;
    cursor: pointer;
    z-index: 1200;
  }
  #pageLeftBtn {
    left: 191.3px;
    top: 1040.1px;
  }
  #pageRightBtn {
    left: 1655.9px;
    top: 1040.1px;
  }

  /* iframe表示 */
  #contentIframe {
    position: absolute;
    left: 191.3px;
    top: 0;
    width: 1534.9px;
    height: 1040.1px;
    border: none;
    display: none;
    background: #fff;
  }

  /* 閉じるボタン */
  #closeIframeBtn {
    position: absolute;
    width: 46.8px;
    height: 46.8px;
    left: 1670px;
    top: 6.5px;
    cursor: pointer;
    z-index: 1300;
    display: none;
  }
</style>
</head>
<body>

<div id="parentContainer">
  <!-- 左サイドバー -->
  <div id="sidebarLeft" class="sidebar">
    <button class="sidebarItem" data-action="zoomIn"><img src="01.svg" alt="拡大" loading="lazy"></button>
    <button class="sidebarItem" data-action="zoomOut"><img src="02.svg" alt="縮小" loading="lazy"></button>
    <button class="sidebarItem" data-action="resetZoom"><img src="03.svg" alt="100%" loading="lazy"></button>
    <button class="sidebarItem" data-action="keySentences"><img src="04.svg" alt="Key Sentences" loading="lazy"></button>
    <button class="sidebarItem" data-action="yourei"><img src="05.svg" alt="用例辞典" loading="lazy"></button>
    <button class="sidebarItem" data-action="digitalMap"><img src="06.svg" alt="デジタルマップ" loading="lazy"></button>
    <button class="sidebarItem" data-action="originalCard"><img src="07.svg" alt="オリジナル絵カード" loading="lazy"></button>
    <button class="sidebarItem disabled" data-action="toc" disabled><img src="08.svg" alt="目次" loading="lazy"></button>
  </div>

  <!-- 右サイドバー -->
  <div id="sidebarRight" class="sidebar" style="display:none;">
    <button class="sidebarItem" data-action="zoomIn"><img src="01.svg" alt="拡大" loading="lazy"></button>
    <button class="sidebarItem" data-action="zoomOut"><img src="02.svg" alt="縮小" loading="lazy"></button>
    <button class="sidebarItem" data-action="resetZoom"><img src="03.svg" alt="100%" loading="lazy"></button>
    <button class="sidebarItem" data-action="keySentences"><img src="04.svg" alt="Key Sentences" loading="lazy"></button>
    <button class="sidebarItem" data-action="yourei"><img src="05.svg" alt="用例辞典" loading="lazy"></button>
    <button class="sidebarItem" data-action="digitalMap"><img src="06.svg" alt="デジタルマップ" loading="lazy"></button>
    <button class="sidebarItem" data-action="originalCard"><img src="07.svg" alt="オリジナル絵カード" loading="lazy"></button>
    <button class="sidebarItem disabled" data-action="toc" disabled><img src="08.svg" alt="目次" loading="lazy"></button>
  </div>

  <!-- 切替ボタン -->
  <img id="toggleLeftSwitch" src="sidebar-left.svg" alt="左切替スイッチ" loading="lazy" style="display:none;">
  <img id="toggleRightSwitch" src="sidebar-right.svg" alt="右切替スイッチ" loading="lazy">

  <!-- 紙面画像 -->
  <div id="pageContainer">
    <img id="pageImage" src="pages/1.png" alt="紙面画像" draggable="false" />
  </div>

  <!-- ページ切替ボタン -->
  <img id="pageLeftBtn" src="page-left.svg" alt="前ページ" loading="lazy" />
  <img id="pageRightBtn" src="page-right.svg" alt="次ページ" loading="lazy" />

  <!-- iframe -->
  <iframe id="contentIframe" src="" frameborder="0"></iframe>

  <!-- 閉じるボタン -->
  <img id="closeIframeBtn" src="close.svg" alt="閉じる" loading="lazy" />
</div>

<script>
  const sidebarLeft = document.getElementById('sidebarLeft');
  const sidebarRight = document.getElementById('sidebarRight');
  const toggleLeftSwitch = document.getElementById('toggleLeftSwitch');
  const toggleRightSwitch = document.getElementById('toggleRightSwitch');
  const pageImage = document.getElementById('pageImage');
  const pageContainer = document.getElementById('pageContainer');
  const pageLeftBtn = document.getElementById('pageLeftBtn');
  const pageRightBtn = document.getElementById('pageRightBtn');
  const contentIframe = document.getElementById('contentIframe');
  const closeIframeBtn = document.getElementById('closeIframeBtn');

  const urls = {
    yourei: 'https://tsnh-ex.web.app/',
    digitalMap: 'https://sw111.tsho.jp/07jk/nh/dm/index.html'
  };

  let currentPage = 1;
  const maxPage = 200;

  let scale = 1;
  let posX = 0;
  let posY = 0;
  let dragStartX = 0;
  let dragStartY = 0;
  let isDragging = false;

  // localStorageからサイドバー位置を読み込み
  function loadSidebarPosition() {
    const pos = localStorage.getItem('sidebarPosition');
    if (pos === 'right') {
      sidebarLeft.style.display = 'none';
      sidebarRight.style.display = 'flex';
      toggleLeftSwitch.style.display = 'block';
      toggleRightSwitch.style.display = 'none';
    } else {
      // left or default
      sidebarLeft.style.display = 'flex';
      sidebarRight.style.display = 'none';
      toggleLeftSwitch.style.display = 'none';
      toggleRightSwitch.style.display = 'block';
    }
  }

  // localStorageにサイドバー位置保存
  function saveSidebarPosition(pos) {
    localStorage.setItem('sidebarPosition', pos);
  }

  toggleRightSwitch.addEventListener('click', () => {
    sidebarLeft.style.display = 'none';
    sidebarRight.style.display = 'flex';
    toggleRightSwitch.style.display = 'none';
    toggleLeftSwitch.style.display = 'block';
    saveSidebarPosition('right');
  });

  toggleLeftSwitch.addEventListener('click', () => {
    sidebarRight.style.display = 'none';
    sidebarLeft.style.display = 'flex';
    toggleLeftSwitch.style.display = 'none';
    toggleRightSwitch.style.display = 'block';
    saveSidebarPosition('left');
  });

  // --- ページ画像＆操作関連（省略せず載せる） ---

  // ページ画像更新
  function updatePageImage() {
    pageImage.src = `pages/${currentPage}.png`;
  }

  // 拡大縮小反映
  function applyTransform() {
    pageImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }

  // ドラッグ開始
  pageImage.addEventListener('mousedown', e => {
    if (scale <= 1) return;
    isDragging = true;
    dragStartX = e.clientX - posX;
    dragStartY = e.clientY - posY;
    pageImage.style.cursor = 'grabbing';
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    pageImage.style.cursor = 'grab';
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    posX = e.clientX - dragStartX;
    posY = e.clientY - dragStartY;
    applyTransform();
  });

  // タッチ対応
  pageImage.addEventListener('touchstart', e => {
    if (scale <= 1) return;
    const touch = e.touches[0];
    isDragging = true;
    dragStartX = touch.clientX - posX;
    dragStartY = touch.clientY - posY;
  });

  window.addEventListener('touchend', () => {
    isDragging = false;
  });

  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const touch = e.touches[0];
    posX = touch.clientX - dragStartX;
    posY = touch.clientY - dragStartY;
    applyTransform();
  });

  // ページ切替
  pageLeftBtn.addEventListener('click', () => {
    if(currentPage > 1) {
      currentPage--;
      updatePageImage();
      resetZoomAndPos();
    }
  });
  pageRightBtn.addEventListener('click', () => {
    if(currentPage < maxPage) {
      currentPage++;
      updatePageImage();
      resetZoomAndPos();
    }
  });

  // 拡大縮小リセット
  function resetZoomAndPos() {
    scale = 1;
    posX = 0;
    posY = 0;
    applyTransform();
  }

  // サイドバーのボタンクリック処理
  function handleSidebarClick(action) {
    function closeIframe() {
      contentIframe.style.display = 'none';
      closeIframeBtn.style.display = 'none';
      pageContainer.style.display = 'block';
      resetZoomAndPos();
    }

    switch(action) {
      case 'zoomIn':
        scale = Math.min(scale + 0.4, 3);
        applyTransform();
        break;
      case 'zoomOut':
        scale = Math.max(scale - 0.4, 0.4);
        if(scale <= 1) resetZoomAndPos();
        else applyTransform();
        break;
      case 'resetZoom':
        resetZoomAndPos();
        break;
      case 'keySentences':
        window.location.href = 'key-sentences.html';
        break;
      case 'yourei':
        pageContainer.style.display = 'none';
        contentIframe.src = urls.yourei;
        contentIframe.style.display = 'block';
        closeIframeBtn.style.display = 'block';
        break;
      case 'digitalMap':
        pageContainer.style.display = 'none';
        contentIframe.src = urls.digitalMap;
        contentIframe.style.display = 'block';
        closeIframeBtn.style.display = 'block';
        break;
      case 'originalCard':
        pageContainer.style.display = 'none';
        contentIframe.src = 'https://digibook.tokyo-shoseki.co.jp/sample/nh/contents/originalcard/index.html?g=2';
        contentIframe.style.display = 'block';
        closeIframeBtn.style.display = 'block';
        break;
      case 'toc':
        // 何もしない
        break;
    }
  }

  // サイドバー共通イベント登録
  function addSidebarListeners(sidebar) {
    const buttons = sidebar.querySelectorAll('.sidebarItem');
    buttons.forEach(btn => {
      if(btn.classList.contains('disabled')) return;
      btn.addEventListener('click', () => {
        const action = btn.getAttribute('data-action');
        handleSidebarClick(action);
      });
    });
  }

  addSidebarListeners(sidebarLeft);
  addSidebarListeners(sidebarRight);

  // 閉じるボタン処理
  closeIframeBtn.addEventListener('click', () => {
    contentIframe.style.display = 'none';
    closeIframeBtn.style.display = 'none';
    pageContainer.style.display = 'block';
    resetZoomAndPos();
  });

  // リサイズ処理
  function resizeContainer() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const baseWidth = 1920;
    const baseHeight = 1080;
    const aspectRatio = baseWidth / baseHeight;

    let scaleFactor;
    if (vw / vh > aspectRatio) {
      scaleFactor = vh / baseHeight;
    } else {
      scaleFactor = vw / baseWidth;
    }

    const parent = document.getElementById('parentContainer');
    parent.style.transform = `translate(-50%, -50%) scale(${scaleFactor})`;
  }
  window.addEventListener('resize', resizeContainer);
  window.addEventListener('load', () => {
    loadSidebarPosition();
    resizeContainer();
  });

  // 初期化
  updatePageImage();
  applyTransform();
</script>

</body>
</html>
